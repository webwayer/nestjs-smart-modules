name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run validate

  nest-compat:
    name: nest ${{ matrix.nest }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported peer line.
          - nest: '10'
            config: '3'
            flags: ''
            experimental: false
          # Current stable line (matches devDependencies).
          - nest: '11'
            config: '4'
            flags: ''
            experimental: false
          # v12 pre-release (pure ESM). Alpha peer deps still reference ^11,
          # hence --legacy-peer-deps; Jest cannot require(esm) yet, so this
          # job is allowed to fail — it tracks forward compatibility only.
          - nest: 'next'
            config: 'next'
            flags: '--legacy-peer-deps'
            experimental: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save ${{ matrix.flags }} @nestjs/common@${{ matrix.nest }} @nestjs/core@${{ matrix.nest }} @nestjs/testing@${{ matrix.nest }} @nestjs/platform-express@${{ matrix.nest }} @nestjs/config@${{ matrix.config }}
      - run: npm test
