name: CI

on:
  push:
    # release-please--** covers manual pushes to a Release-PR branch. Pushes
    # made by release-please itself use GITHUB_TOKEN, and GITHUB_TOKEN events
    # never trigger workflows — so release-please.yml additionally dispatches
    # this workflow onto the release branch (workflow_dispatch is exempt from
    # that suppression rule).
    branches: [main, 'release-please--**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24, 26]
        include:
          # The declared engines floor, exactly. NestJS 11 itself needs Node
          # 20+, so a real Node 18 user runs Nest <= 10: this cell tests the
          # floor against NestJS 10 and skips dev tooling that needs modern
          # Node (ESLint 10 and rimraf 6 require 20.19+).
          - node: '18.16.0'
            floor: true
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run validate
        if: ${{ !matrix.floor }}
      - if: ${{ matrix.floor }}
        run: |
          npm install --no-save @nestjs/common@10 @nestjs/core@10 @nestjs/testing@10 @nestjs/platform-express@10 @nestjs/config@3
          npm test
          npx tsc -p tsconfig.build.cjs.json
          npx tsc -p tsconfig.build.esm.json
          node scripts/write-dual-markers.mjs
          node -e "const m = require('./build/cjs/index.js'); if (typeof m.smartModule !== 'function') process.exit(1)"
          node -e "import('./build/esm/index.js').then(m => { if (typeof m.smartModule !== 'function') process.exit(1) }).catch(() => process.exit(1))"

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:package
      - run: npm run check:knip
      # Smoke both published entry points: nothing else in CI executes the
      # ESM artifact, and a missing .js specifier would only fail at runtime.
      - run: node -e "const m = require('./build/cjs/index.js'); if (typeof m.smartModule !== 'function') process.exit(1)"
      - run: node -e "import('./build/esm/index.js').then(m => { if (typeof m.smartModule !== 'function') process.exit(1) }).catch(() => process.exit(1))"
      # The tuple-hack removal relies on modern inference: verify the public
      # factory types still infer (and reject invalid configs) on the oldest
      # supported TypeScript.
      - run: npx -y -p typescript@5.0 tsc --noEmit --strict --skipLibCheck --module nodenext --moduleResolution nodenext --target es2022 --experimentalDecorators --strictPropertyInitialization false spec/factory-inference.type-probe.ts

  commitlint:
    name: commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2

  nest-compat:
    name: nest ${{ matrix.nest }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported peer lines. --legacy-peer-deps: their peer
          # reflect-metadata ^0.1 conflicts with the installed 0.2 (runtime
          # compatible), and @nestjs/config@2 predates the newer peer ranges.
          - nest: '8'
            config: '2'
            flags: '--legacy-peer-deps'
            experimental: false
          - nest: '9'
            config: '2'
            flags: '--legacy-peer-deps'
            experimental: false
          - nest: '10'
            config: '3'
            flags: ''
            experimental: false
          # Current stable line (matches devDependencies).
          - nest: '11'
            config: '4'
            flags: ''
            experimental: false
          # v12 pre-release (pure ESM). Alpha peer deps still reference ^11,
          # hence --legacy-peer-deps; Jest cannot require(esm) yet, so this
          # job is allowed to fail — it tracks forward compatibility only.
          - nest: 'next'
            config: 'next'
            flags: '--legacy-peer-deps'
            experimental: true
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save ${{ matrix.flags }} @nestjs/common@${{ matrix.nest }} @nestjs/core@${{ matrix.nest }} @nestjs/testing@${{ matrix.nest }} @nestjs/platform-express@${{ matrix.nest }} @nestjs/config@${{ matrix.config }}
      - run: npm test
        if: ${{ !matrix.experimental }}
      # Forward-compatibility tracking: failures are expected until the v12 RC
      # (issue 2) and surface as a warning annotation instead of a red check.
      # Block scalar keeps the issue reference out of YAML comment territory.
      - if: ${{ matrix.experimental }}
        run: |
          npm test || echo "::warning title=NestJS next compatibility::npm test fails against @nestjs/common@next — expected until the v12 RC (see issue 2)"
