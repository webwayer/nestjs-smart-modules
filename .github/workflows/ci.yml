name: CI

on:
  push:
    # release-please--** covers manual pushes to a Release-PR branch. Pushes
    # made by release-please itself use GITHUB_TOKEN, and GITHUB_TOKEN events
    # never trigger workflows — so release-please.yml additionally dispatches
    # this workflow onto the release branch (workflow_dispatch is exempt from
    # that suppression rule).
    branches: [main, 'release-please--**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tooling checks run once on the development pair (lockfile NestJS and the
  # .nvmrc Node): typecheck, lint, format, tests, coverage threshold, knip,
  # build, publint, attw. Compatibility is the grid job's business.
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run validate

  # The full compatibility grid: every supported NestJS major against every
  # Node line it supports. The only hole is Nest 11 on the Node 18 floor —
  # Nest 11 itself requires Node >= 20.
  compat:
    name: nest ${{ matrix.nest }} / node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nest: ['8', '9', '10', '11']
        node: ['18.16.0', '20', '22', '24', '26']
        exclude:
          - nest: '11'
            node: '18.16.0'
        # Companion versions per major; an include entry that matches a combo
        # by `nest` extends every cell of that major. --legacy-peer-deps for
        # 8/9: their reflect-metadata ^0.1 peer conflicts with the installed
        # 0.2 (runtime compatible), and @nestjs/config@2 predates newer peers.
        include:
          - nest: '8'
            config: '2'
            flags: '--legacy-peer-deps'
          - nest: '9'
            config: '2'
            flags: '--legacy-peer-deps'
          - nest: '10'
            config: '3'
            flags: ''
          - nest: '11'
            config: '4'
            flags: ''
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm install --no-save ${{ matrix.flags }} @nestjs/common@${{ matrix.nest }} @nestjs/core@${{ matrix.nest }} @nestjs/testing@${{ matrix.nest }} @nestjs/platform-express@${{ matrix.nest }} @nestjs/config@${{ matrix.config }}
      - run: npm test

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:package
      - run: npm run check:knip
      # Smoke both published entry points: nothing else in CI executes the
      # ESM artifact, and a missing .js specifier would only fail at runtime.
      - run: node -e "const m = require('./build/cjs/index.js'); if (typeof m.smartModule !== 'function') process.exit(1)"
      - run: node -e "import('./build/esm/index.js').then(m => { if (typeof m.smartModule !== 'function') process.exit(1) }).catch(() => process.exit(1))"
      # The tuple-hack removal relies on modern inference: verify the public
      # factory types still infer (and reject invalid configs) on the oldest
      # supported TypeScript.
      - run: npx -y -p typescript@5.0 tsc --noEmit --strict --skipLibCheck --module nodenext --moduleResolution nodenext --target es2022 --experimentalDecorators --strictPropertyInitialization false spec/factory-inference.type-probe.ts

  commitlint:
    name: commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2

  # v12 pre-release (pure ESM), on the dev Node only. Alpha peer deps still
  # reference ^11, hence --legacy-peer-deps; Jest cannot require(esm) yet, so
  # failures are expected until the v12 RC (issue 2) and surface as a warning
  # annotation instead of a red check.
  nest-next:
    name: nest next
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm install --no-save --legacy-peer-deps @nestjs/common@next @nestjs/core@next @nestjs/testing@next @nestjs/platform-express@next @nestjs/config@next
      - run: |
          npm test || echo "::warning title=NestJS next compatibility::npm test fails against @nestjs/common@next — expected until the v12 RC (see issue 2)"
