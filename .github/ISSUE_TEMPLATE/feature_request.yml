name: Feature request
description: Propose an improvement or new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to achieve that is currently hard or impossible?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would it look in code? A sketch of the desired API is ideal.
      render: typescript
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
