name: Bug report
description: Something behaves incorrectly
labels: [bug]
body:
  - type: input
    id: lib-version
    attributes:
      label: nestjs-smart-modules version
      placeholder: 1.0.3
    validations:
      required: true
  - type: input
    id: nest-version
    attributes:
      label: NestJS version (@nestjs/common)
      placeholder: 11.1.28
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: 24.x
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest smartModule setup that shows the problem (code block or repo link).
      render: typescript
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behavior
    validations:
      required: true
